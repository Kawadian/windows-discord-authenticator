[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uac-approval-discord"
version = "0.1.0"
description = "Time-limited local UAC credentials approved through Discord"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.5,<3",
  "Pillow>=11,<13",
  "psutil>=6,<8",
  "dxcam==0.3.0; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["approval_agent*"]

name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q approval_agent
      - name: Windows import smoke test
        if: runner.os == 'Windows'
        run: python -c "import approval_agent.tray, approval_agent.service, approval_agent.runner"
      - name: Local administrator account compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          try {
            $secret = ConvertTo-SecureString -String ('Aa1!' + [Convert]::ToBase64String($bytes)) -AsPlainText -Force
            $account = New-LocalUser -Name UacApprovalProbe -Password $secret -PasswordNeverExpires -Description 'UAC Approval temporary admin'
            if (-not $account.SID) { throw 'No SID returned' }
          } catch {
            Write-Output $_.Exception.ToString()
            throw
          } finally {
            Remove-LocalUser -Name UacApprovalProbe -ErrorAction SilentlyContinue
          }
      - name: PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts, packaging -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "Invalid PowerShell syntax in $($_.Name): $($errors -join '; ')" }
          }

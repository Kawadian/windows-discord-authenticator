name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q approval_agent
      - name: Windows import smoke test
        if: runner.os == 'Windows'
        run: python -c "import approval_agent.tray, approval_agent.service, approval_agent.runner"

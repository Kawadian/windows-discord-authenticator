name: Build Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'approval_agent/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'approval_agent/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/installer.yml'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build self-contained executables and installer
        shell: pwsh
        run: ./packaging/build.ps1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Installer lifecycle smoke test
        shell: pwsh
        run: ./packaging/test-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: UacApproval-Windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
